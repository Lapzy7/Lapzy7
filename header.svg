<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="title" x1="200" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aab2ff"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -1px; fill: url(#title); animation: rise 1.2s ease-out both; }
      .line  { animation: grow 1.2s 0.3s ease-out both; transform-origin: 400px 140px; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
    </style>
  </defs>
  <rect width="800" height="220" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="799" height="219" rx="15.5" stroke="#5865F2" stroke-opacity="0.25"/>
  <text x="400" y="122" text-anchor="middle" class="title">Welcome to LapZone!</text>
  <rect class="line" x="360" y="146" width="80" height="3" rx="1.5" fill="#5865F2"/>
</svg>
